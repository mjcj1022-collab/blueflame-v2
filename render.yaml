# Render blueprint for the Mandrel API.
#
# NOTE (Blue Flame → Mandrel rename, 2026-08): the `name:` fields below were
# renamed from blue-flame-api / blue-flame-data. Do NOT hit "Sync Blueprint"
# in the Render dashboard without reading server-side-rename-notes first —
# Render matches existing resources by name, so a straight sync could create
# a brand-new (empty) service + disk instead of renaming the live one. Rename
# the existing service in the Render dashboard (Settings → Name) yourself
# first, then this file will match it on the next sync. The app code already
# migrates the SQLite file itself if it ever does end up on a fresh disk.
#
# Deploy: Render → New → Blueprint → point at this repo. Render reads this file.
# Requires Node ≥ 23.4 for the built-in node:sqlite (pinned via server/.node-version).
services:
  - type: web
    name: mandrel-api
    runtime: node
    rootDir: server
    plan: free                       # free tier — matches the old blue-flame-api service (no persistent disk)
    buildCommand: npm install
    startCommand: npm run seed && npm run start
    healthCheckPath: /api/health
    # NOTE: no mounted disk on the free plan, so the SQLite file is ephemeral —
    # it resets on every deploy/restart (accounts, team, cloud sculpts, orders
    # all reseed). This matches the old blue-flame-api service's setup exactly,
    # so switching to this service is not a behavior regression. Upgrade to
    # `plan: starter` + add a `disk:` block later if persistent data is needed.
    envVars:
      - key: JWT_SECRET
        generateValue: true          # Render generates a strong secret for you
      - key: CLIENT_ORIGIN
        value: https://mjcj1022-collab.github.io,https://mandrel.netlify.app   # comma-separated allowed origins (for CORS)
      - key: DB_FILE
        value: mandrel.db            # local ephemeral file (free tier has no persistent disk)
      # Live metal spot feed (OPTIONAL). Set METALS_API_KEY to your provider key
      # and quotes track the real gold/platinum market; unset → catalog spots.
      # Provider: 'metalpriceapi' (default, one request) or 'goldapi'.
      - key: METALS_API_KEY
        sync: false
      - key: METALS_PROVIDER
        sync: false
      # Stripe is OPTIONAL. Leave unset to run without payments. To enable checkout,
      # set both in the Render dashboard → Environment (test keys first):
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Subscription / purchase price ids (from Stripe → Products). Needed to sell
      # access: STRIPE_PRICE_MONTHLY = the $40/mo recurring price, STRIPE_PRICE_OFFLINE
      # = the $450 one-time price. The paywall goes live once these + the keys are set.
      - key: STRIPE_PRICE_MONTHLY
        sync: false
      - key: STRIPE_PRICE_OFFLINE
        sync: false

# --- Upgrading to a persistent disk later -----------------------------------
# To keep data (accounts, team, cloud sculpts, orders) across deploys, switch to
# a paid plan and mount a disk:
#     plan: starter
#     disk:
#       name: mandrel-data
#       mountPath: /var/data
#       sizeGB: 1
# and point DB_FILE at the mounted disk:
#     - key: DB_FILE
#       value: /var/data/mandrel.db
